<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('tdl_theme');if(t)t=t.replace(/"/g,'');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Central de Ajuda — Flowrish</title>
<meta name="theme-color" content="#43442A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="description" content="Fale com a equipe da Flowrish — envie sua dúvida, sugestão ou problema.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/ajuda.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="ajuda-body">
<div id="navbar-root"></div>

<main class="ajuda-page">
  <form id="ajudaForm" class="ajuda-card">
    <h1 class="ajuda-titulo">Central de ajuda!</h1>
    <p class="ajuda-texto">Tem alguma dúvida, sugestão ou problema? Nos escreva e responderemos seu email assim que possível!</p>
    <label class="ajuda-label" for="ajudaNome">Nome</label>
    <input class="ajuda-input" type="text" id="ajudaNome" required autocomplete="name">
    <label class="ajuda-label" for="ajudaEmail">Email</label>
    <input class="ajuda-input" type="email" id="ajudaEmail" required autocomplete="email">
    <label class="ajuda-label" for="ajudaMensagem">Mensagem</label>
    <textarea class="ajuda-input ajuda-mensagem" id="ajudaMensagem" rows="5" required></textarea>
    <button type="submit" class="ajuda-enviar" id="ajudaSubmitBtn">Enviar</button>
  </form>
</main>

<div id="footer-root"></div>
<script type="module" src="js/ajuda.js"></script>
</body>
</html>
