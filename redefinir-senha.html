<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('tdl_theme');if(t)t=t.replace(/"/g,'');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Redefinir senha — Flowrish</title>
<meta name="description" content="Defina uma nova senha para sua conta Flowrish.">
<meta name="theme-color" content="#43442A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <div class="auth-deco" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="auth-brand-content">
      <a href="index.html" class="auth-logo" aria-label="Flowrish — início">
        Fl<img src="assets/flor-logo.svg" alt="">wrish
      </a>
      <p class="auth-visual-tagline">Recupere o acesso à sua conta e continue suas trocas na comunidade.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <a href="login.html" class="auth-back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para o login
      </a>
      <h1 class="auth-title">Redefinir senha</h1>
      <p class="auth-subtitle" id="redefinirSubtitle">Verificando o link recebido...</p>

      <form id="redefinirForm" novalidate style="display:none;">
        <div class="field">
          <label for="novaSenha">Nova senha</label>
          <input class="input" type="password" id="novaSenha" required minlength="6" placeholder="Mínimo 6 caracteres">
          <div class="password-strength"><span id="strengthBar"></span></div>
        </div>
        <div class="field">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input class="input" type="password" id="confirmarNovaSenha" required minlength="6" placeholder="Repita a senha">
          <p class="hint" id="confirmarNovaSenhaHint" style="display:none;color:var(--danger);font-size:0.85rem;margin-top:4px;">As senhas não coincidem.</p>
        </div>
        <button type="submit" class="auth-submit">Atualizar senha</button>
      </form>

      <div id="redefinirInvalido" style="display:none;margin-top:20px;">
        <a href="login.html" class="btn btn-secondary btn-block">Voltar para o login</a>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/redefinir-senha.js"></script>
</body>
</html>
